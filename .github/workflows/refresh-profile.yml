name: Refresh THOTH FND profile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'data/profile.json'
      - 'requirements.txt'
      - '.github/workflows/refresh-profile.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for deterministic raster rendering
        run: python -m playwright install --with-deps chromium
      - name: Validate cleanup safety gate
        run: python scripts/cleanup_repo.py
      - name: Clean legacy/generated assets safely
        run: python scripts/cleanup_repo.py --apply
      - name: Collect live GitHub data and public pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_github.py
      - name: Build visual source and README
        run: python scripts/build_profile.py
      - name: Render GitHub-compatible assets
        run: python scripts/render_assets.py
      - name: Validate generated output and motion
        run: python scripts/validate_build.py
      - name: Commit meaningful changes only
        shell: bash
        run: |
          git add README.md assets/generated data/runtime.json
          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi
          git config user.name "thoth-profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "profile: refresh generated presentation"
          git push
