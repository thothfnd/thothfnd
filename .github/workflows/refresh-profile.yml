name: Refresh profile interface

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-interface-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache portrait segmentation model
        uses: actions/cache@v5
        with:
          path: ~/.u2net
          key: rembg-u2net-v3

      - name: Install renderer
        run: python -m pip install -r requirements.txt

      - name: Generate profile
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile.py

      - name: Commit only meaningful changes
        run: |
          git add assets/generated/
          if git diff --cached --quiet; then
            echo "No public profile data changed. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "profile: refresh generated interface"
          git push
