name: V7 legacy cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify V7 is complete
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "README.md"
            "requirements.txt"
            "LICENSE"
            ".github/workflows/refresh-profile.yml"
            "scripts/generate_profile.py"
            "data/profile.json"
            "data/capabilities.json"
            "assets/generated/hero.svg"
            "assets/generated/identity.svg"
            "assets/generated/capabilities.svg"
            "assets/generated/works.svg"
            "assets/generated/signal.svg"
            "assets/generated/footer.svg"
          )

          for f in "${required[@]}"; do
            if [[ ! -e "$f" ]]; then
              echo "::error::Missing required V7 file: $f"
              exit 2
            fi
          done

      - name: Remove V1-V6 legacy files
        shell: bash
        run: |
          set -euo pipefail

          legacy=(
            "assets/about.svg"
            "assets/activity.svg"
            "assets/avatar-ascii.svg"
            "assets/footer.svg"
            "assets/hero.svg"
            "assets/identity.svg"
            "assets/portrait.svg"
            "assets/profile-meta.svg"
            "assets/signal.svg"
            "assets/stack.svg"
            "assets/stats.svg"
            "assets/works.svg"
            "assets/year.svg"
            "assets/hd-about.svg"
            "assets/hd-stack.svg"
            "assets/hd-projects.svg"
            "assets/hd-stats.svg"
            "assets/projects"
            "scripts/render_ascii.py"
            "scripts/render_meta.py"
            "scripts/sync_avatar.py"
            "INSTALL-SIMPLE.txt"
            "SETUP.md"
            "WORKFLOW-PASTE.txt"
          )

          for path in "${legacy[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Removing $path"
              rm -rf -- "$path"
            fi
          done

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No legacy files found. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: remove pre-V7 profile artifacts"
          git push
