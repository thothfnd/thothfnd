<svg xmlns="http://www.w3.org/2000/svg" width="880" height="324" viewBox="0 0 880 324">
<style>
.display{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;fill:#f4f4f5}
.sans{font-family:"Helvetica Neue",Arial,system-ui,sans-serif;fill:#f4f4f5}
.serif{font-family:Georgia,"Times New Roman",serif;fill:#b7bac0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#f4f4f5}
.soft{fill:#b7bac0}.faint{fill:#7f838b}.chrome{fill:#dfe2e6}
</style>

<defs><linearGradient id="stackchrome" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e949b"/><stop offset=".48" stop-color="#f7f7f8"/><stop offset="1" stop-color="#8b9097"/></linearGradient></defs>
