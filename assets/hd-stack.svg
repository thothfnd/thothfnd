<svg xmlns="http://www.w3.org/2000/svg" width="880" height="48" viewBox="0 0 880 48">
<style>
.title{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#f5f7fa}
.sans{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#f5f7fa}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#f5f7fa}
.muted{fill:#a1a8b3}.subtle{fill:#7b828d}.light{fill:#d4d7dc}

</style>

<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d4d7dc" stop-opacity=".9"/>
    <stop offset="1" stop-color="#d4d7dc" stop-opacity="0"/>
  </linearGradient>
</defs>
<text x="8" y="30" class="title" font-size="18" font-weight="700">stack</text>
<line x1="150" y1="24" x2="870" y2="24" stroke="#2a2d33" stroke-width="1"/>
<rect x="150" y="23" width="0" height="2" fill="url(#metal)"><animate attributeName="width" from="0" to="150" dur="1.0s" begin=".12s" fill="freeze"/></rect>
<rect x="8" y="39" width="0" height="1.5" fill="#b8bec6"><animate attributeName="width" values="0;48;0" dur="3.2s" repeatCount="indefinite"/></rect>

</svg>