<svg xmlns="http://www.w3.org/2000/svg" width="880" height="48" viewBox="0 0 880 48">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
.fg{fill:#edf2f8}.muted{fill:#7d8796}.accent{fill:#6aa8ff}.good{fill:#3fb950}
.small{font-size:10px} .tiny{font-size:8px} .label{font-size:9px;letter-spacing:.18em}

</style>

<defs>
  <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6aa8ff" stop-opacity=".75"/>
    <stop offset="1" stop-color="#6aa8ff" stop-opacity="0"/>
  </linearGradient>
</defs>
<text x="8" y="30" class="fg" font-size="18" font-weight="700">stack</text>
<line x1="150" y1="24" x2="870" y2="24" stroke="#2b3340" stroke-width="1"/>
<rect x="150" y="23" width="0" height="2" fill="url(#hdr)">
 <animate attributeName="width" from="0" to="180" dur="1.1s" begin=".1s" fill="freeze"/>
</rect>
<rect x="8" y="39" width="0" height="1.5" fill="#6aa8ff">
 <animate attributeName="width" values="0;52;0" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>