anchor="middle" class="text" font-size="16.5" opacity="0">I’m drawn to privacy, security, anonymity, systems, automation and the difficult parts most people never<animate attributeName="opacity" from="0" to="1" dur=".8s" begin="5.25s" fill="freeze"/></text><text x="600" y="767" text-anchor="middle" class="text" font-size="16.5" opacity="0">look at.<animate attributeName="opacity" from="0" to="1" dur=".8s" begin="5.53s" fill="freeze"/></text><text x="600" y="794" text-anchor="middle" class="text" font-size="16.5" opacity="0">I like understanding how things actually behave under the surface, finding where assumptions fail, and<animate attributeName="opacity" from="0" to="1" dur=".8s" begin="5.81s" fill="freeze"/></text><text x="600" y="821" text-anchor="middle" class="text" font-size="16.5" opacity="0">turning that understanding into cleaner, stronger systems.<animate attributeName="opacity" from="0" to="1" dur=".8s" begin="6.09s" fill="freeze"/></text><text x="600" y="848" text-anchor="middle" class="text" font-size="16.5" opacity="0">I tend to go deep: browsers, networks, cryptography, low-level behavior, infrastructure and anything that<animate attributeName="opacity" from="0" to="1" dur=".8s" begin="6.37s" fill="freeze"/></text>
</svg>