<text x="86" y="170" class="mono" font-size="12" letter-spacing="3">IN DEVELOPMENT</text><text x="86" y="232" class="display" font-size="45" font-weight="760">THOTH BROWSER</text><text x="86" y="268" class="text" font-size="18">Privacy-first browser project</text><text x="86" y="620" class="text" font-size="16">A browser project built around compartmentalization,</text><text x="86" y="646" class="text" font-size="16">isolation, anti-correlation design and stronger privacy</text><text x="86" y="672" class="text" font-size="16">boundaries.</text><g transform="translate(330 420)"><ellipse rx="174" ry="120" fill="none" stroke="#2d323a" stroke-width="1.5"/><ellipse rx="132" ry="90" fill="none" stroke="#575e69" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/></ellipse><ellipse rx="88" ry="60" fill="none" stroke="#8d949f" opacity=".5"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/></ellipse><circle cx="132.0" cy="0.0" r="8" fill="#15181d" stroke="#a7adb6"><animate attributeName="r" values="7;10;7" dur="3.2s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="66.0" cy="77.9" r="8" fill="#15181d" stroke="#a7adb6"><animate attributeName="r" values="7;10;7" dur="3.5s" begin="0.17s" repeatCount="indefinite"/></circle><circle cx="-66.0" cy="77.9" r="8" fill="#15181d" stroke="#a7adb6"><animate attributeName="r" values="7;10;7" dur="3.9s" begin="0.33s" repeatCount="indefinite"/></circle><circle cx="-132.0" cy="0.0" r="8" fill="#15181d" stroke="#a7adb6"><animate attributeName="r" values="7;10;7" dur="4.2s" begin="0.50s" repeatCount="indefinite"/></circle><circle cx="-66.0" cy="-77.9" r="8" fill="#15181d" stroke="#a7adb6"><animate attributeName="r" values="7;10;7" dur="4.5s" begin="0.67s" repeatCount="indefinite"/></circle><circle cx="66.0" cy="-77.9" r="8" fill="#15181d" stroke="#a7adb6"><animate attributeName="r" values="7;10;7" dur="4.9s" begin="0.83s" repeatCount="indefinite"/></circle><circle r="38" fill="url(#coreMetal)" stroke="#e1e4e8" stroke-opacity=".45"/><path d="M-16,-10 L0,-24 L16,-10 L12,20 L0,32 L-12,20 Z" fill="#090a0c" stroke="#e5e7ea" stroke-opacity=".45"/></g><text x="660" y="170" class="mono" font-size="12" letter-spacing="3">IN DEVELOPMENT</text><text x="660" y="232" class="display" font-size="45" font-weight="760">RELAYX</text><text x="660" y="268" class="text" font-size="18">Second public project</text><text x="660" y="620" class="text" font-size="16">A second project on this account. Its public description</text><text x="660" y="646" class="text" font-size="16">and repository link can evolve directly from this</text><text x="660" y="672" class="text" font-size="16">configuration as the project becomes public.</text><g transform="translate(870 420)"><line x1="-150" y1="-40" x2="-80" y2="-110" stroke="#4a505a" stroke-width="1.4" opacity=".62"><animate attributeName="opacity" values=".25;.9;.25" dur="3.7s" begin="0.0s" repeatCount="indefinite"/></line><line x1="-80" y1="-110" x2="0" y2="-55" stroke="#4a505a" stroke-width="1.4" opacity=".62"><animate attributeName="opacity" values=".25;.9;.25" dur="4.2s" begin="0.2s" repeatCount="indefinite"/></line><line x1="0" y1="-55" x2="95" y2="-130" stroke="#4a505a" stroke-width="1.4" opacity=".62"><animate attributeName="opacity" values=".25;.9;.25" dur="4.6s" begin="0.4s" repeatCount="indefinite"/></line><line x1="95" y1="-130" x2="155" y2="-30" stroke="#4a505a" stroke-width="1.4" opacity=".62"><animate attributeName="opacity" values=".25;.9;.25" dur="5.0s" begin="0.6s" repeatCount="indefinite"/></line><line x1="-150" y1="-40" x2="-95" y2="70" stroke="#4a505a" stroke-width="1.4" opacity=".62"><animate attributeName="opacity" values=".25;.9;.25" dur="4.6s" begin="0.0s" repeatCount="indefinite"/></line><line x1="-95" y1="70" x2="10" y2="95" stroke="#4a505a" stroke-width="1.4" opacity=".62"><animate attributeName="opacity" values=".25;.