<text x="48" y="52" class="fg" font-size="13">I build systems where privacy, compartmentalization and deterministic security are</text>
<text x="48" y="76" class="fg" font-size="13">architectural constraints — not optional features.</text>
<text x="48" y="100" class="fg" font-size="13">Current focus: browser isolation, anti-fingerprinting, evidence-driven certification and</text>
<text x="48" y="124" class="fg" font-size="13">high-assurance automation.</text>
<text x="48" y="192" class="muted" font-size="10">FOCUS // PRIVACY • SECURITY • SYSTEMS</text>
