<rect x="1" y="1" width="878" height="220" rx="18" fill="#0a0a0b" stroke="#2a2d33"/>
<rect x="28" y="32" width="2" height="96" fill="#b8bec6" opacity=".9"/>
<text x="48" y="52" class="sans" font-size="13">I build systems where privacy, compartmentalization and deterministic security are</text>
<text x="48" y="76" class="sans" font-size="13">architectural constraints — not optional features.</text>
<text x="48" y="100" class="sans" font-size="13">Current focus: browser isolation, anti-fingerprinting, evidence-driven certification and</text>
<text x="48" y="124" class="sans" font-size="13">high-assurance automation.</text>
<text x="48" y="198" class="mono subtle" font-size="9">FOCUS // PRIVACY • SECURITY • SYSTEMS</text>
</svg>